name: Test, Build, and Publish API Container
on:
  push:
    branches:
      - main
      - feat/add-auth-endpoints

defaults:
    run:
        working-directory: './api'


jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build docker images
        run: docker compose up -d --build

      - name: Test Project
        id: project_test
        run: docker exec api.thegoodinternet.org python manage.py test

